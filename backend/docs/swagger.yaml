basePath: /
definitions:
  models.Banner:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      end_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      instagram_url:
        type: string
      position:
        type: integer
      start_at:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.CampoConfiguracao:
    properties:
      ativo:
        type: boolean
      descricao:
        type: string
      label:
        description: Apresentação
        type: string
      max:
        type: integer
      max_valor:
        type: number
      min:
        type: integer
      min_valor:
        type: number
      obrigatorio:
        description: Validações
        type: boolean
      opcoes:
        description: Opções (apenas para select, radio, checkbox)
        items:
          type: string
        type: array
      placeholder:
        type: string
      regex:
        type: string
      tipo:
        allOf:
        - $ref: '#/definitions/models.TipoCampo'
        description: Tipo
    type: object
  models.CampoFormulario:
    properties:
      configuracao:
        type: string
      created_at:
        type: string
      formulario_modelo_id:
        type: string
      id:
        type: string
      nome:
        type: string
      ordem:
        type: integer
      updated_at:
        type: string
    type: object
  models.CampoFormularioDTO:
    properties:
      configuracao:
        $ref: '#/definitions/models.CampoConfiguracao'
      id:
        type: string
      nome:
        type: string
      ordem:
        type: integer
    type: object
  models.FormularioModelo:
    properties:
      campos:
        items:
          $ref: '#/definitions/models.CampoFormulario'
        type: array
      created_at:
        type: string
      id:
        type: string
      imagem_url:
        type: string
      nome:
        type: string
      ong_id:
        type: string
      updated_at:
        type: string
    type: object
  models.Ong:
    properties:
      area_de_atuacao:
        $ref: '#/definitions/models.OngRegiao'
      descricao:
        type: string
      email:
        type: string
      endereco:
        type: string
      instagram:
        type: string
      logo:
        type: string
      nome:
        type: string
      nome_responsavel:
        type: string
      site:
        type: string
      telefone:
        type: string
      user_id:
        type: string
      whatsapp:
        type: string
    type: object
  models.OngRegiao:
    enum:
    - Serra
    - Vitória
    - Vila-Velha
    - Cariacica
    type: string
    x-enum-varnames:
    - OngRegiaoSerra
    - OngRegiaoVitoria
    - OngRegiaoVilaVelha
    - OngRegiaoCariacica
  models.PedidoAdocaoDTO:
    properties:
      created_at:
        type: string
      id:
        type: string
      ong_id:
        type: string
      pet_id:
        type: string
      respostas:
        items:
          $ref: '#/definitions/models.RespostaFormularioDTO'
        type: array
      status:
        $ref: '#/definitions/models.PedidoAdocaoStatus'
    type: object
  models.PedidoAdocaoStatus:
    enum:
    - pendente
    - aprovado
    - rejeitado
    - cancelado
    type: string
    x-enum-varnames:
    - PedidoAdocaoPendente
    - PedidoAdocaoAprovado
    - PedidoAdocaoRejeitado
    - PedidoAdocaoCancelado
  models.Pet:
    properties:
      created_at:
        type: string
      descricao:
        type: string
      especie:
        type: string
      formulario_id:
        type: string
      id:
        type: string
      idade:
        type: integer
      imagens:
        items:
          $ref: '#/definitions/models.PetImage'
        type: array
      nome:
        type: string
      ong_id:
        type: string
      peso:
        type: number
      porte:
        type: string
      raca:
        type: string
      regiao:
        type: string
      status:
        $ref: '#/definitions/models.PetStatus'
      updated_at:
        type: string
    type: object
  models.PetImage:
    properties:
      pet_id:
        type: string
      position:
        description: ordem no frontend
        type: integer
      url:
        type: string
    type: object
  models.PetStatus:
    enum:
    - adopted
    - available
    - draft
    type: string
    x-enum-varnames:
    - PetAdopted
    - PetAvailable
    - PetDraft
  models.RespostaFormulario:
    properties:
      campo_formulario_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      pedido_adocao_id:
        type: string
      updated_at:
        type: string
      valor:
        description: |-
          Para tipo "imagem": começa vazio ("") e é preenchido via
          POST /pedidos-adocao/:pedidoId/respostas/:respostaId/imagem
        type: string
    type: object
  models.RespostaFormularioDTO:
    properties:
      campo:
        $ref: '#/definitions/models.CampoFormularioDTO'
      id:
        type: string
      valor:
        type: string
    type: object
  models.TipoCampo:
    enum:
    - texto
    - numero
    - select
    - radio
    - checkbox
    - textarea
    - email
    - telefone
    - data
    - imagem
    type: string
    x-enum-comments:
      TipoCampoImagem: adotante envia imagem como resposta
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - adotante envia imagem como resposta
    x-enum-varnames:
    - TipoCampoTexto
    - TipoCampoNumero
    - TipoCampoSelect
    - TipoCampoRadio
    - TipoCampoCheckbox
    - TipoCampoTextarea
    - TipoCampoEmail
    - TipoCampoTelefone
    - TipoCampoData
    - TipoCampoImagem
  v1.BannerListResponse:
    properties:
      dados:
        items:
          $ref: '#/definitions/models.Banner'
        type: array
      proxima_pagina:
        type: boolean
      total_paginas:
        type: integer
      total_registros:
        type: integer
    type: object
  v1.CreateBannerInput:
    properties:
      active:
        type: boolean
      end_at:
        type: string
      instagram_url:
        type: string
      position:
        type: integer
      start_at:
        type: string
      title:
        type: string
    type: object
  v1.CreateCampoInput:
    properties:
      configuracao:
        $ref: '#/definitions/models.CampoConfiguracao'
      nome:
        type: string
      ordem:
        type: integer
    type: object
  v1.CreateFormularioModeloInput:
    properties:
      campos:
        items:
          $ref: '#/definitions/v1.CreateCampoInput'
        type: array
      nome:
        type: string
      ong_id:
        type: string
    type: object
  v1.CreateOngInput:
    properties:
      descricao:
        example: ONG dedicada ao resgate de animais
        type: string
      email:
        example: a@b.com
        type: string
      endereco:
        example: Rua A
        type: string
      instagram:
        example: '@minhaong'
        type: string
      nome:
        example: Minha ONG
        type: string
      nome_responsavel:
        example: Fulano
        type: string
      regiao:
        allOf:
        - $ref: '#/definitions/models.OngRegiao'
        example: Serra
      site:
        example: https://minhaong.org
        type: string
      telefone:
        example: "123"
        type: string
      whatsapp:
        example: https://wa.me/5527999999999
        type: string
    type: object
  v1.CreatePedidoAdocaoInput:
    properties:
      ong_id:
        type: string
      pet_id:
        type: string
      respostas:
        items:
          $ref: '#/definitions/v1.CreateRespostaInput'
        type: array
    type: object
  v1.CreatePetInput:
    properties:
      descricao:
        type: string
      especie:
        type: string
      formulario_id:
        type: string
      idade:
        type: integer
      nome:
        type: string
      ong_id:
        type: string
      peso:
        type: number
      porte:
        type: string
      raca:
        type: string
      regiao:
        type: string
      status:
        $ref: '#/definitions/models.PetStatus'
    type: object
  v1.CreateRespostaInput:
    properties:
      campo_formulario_id:
        type: string
      valor:
        type: string
    type: object
  v1.FormularioListResponse:
    properties:
      dados:
        items:
          $ref: '#/definitions/models.FormularioModelo'
        type: array
      proxima_pagina:
        type: boolean
      total_paginas:
        type: integer
      total_registros:
        type: integer
    type: object
  v1.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  v1.OngListResponse:
    properties:
      dados:
        items:
          $ref: '#/definitions/models.Ong'
        type: array
      proxima_pagina:
        type: boolean
      total_paginas:
        type: integer
      total_registros:
        type: integer
    type: object
  v1.PedidoAdocaoListResponse:
    properties:
      dados:
        items:
          $ref: '#/definitions/models.PedidoAdocaoDTO'
        type: array
      proxima_pagina:
        type: boolean
      total_paginas:
        type: integer
      total_registros:
        type: integer
    type: object
  v1.PetListResponse:
    properties:
      dados:
        items:
          $ref: '#/definitions/models.Pet'
        type: array
      proxima_pagina:
        type: boolean
      total_paginas:
        type: integer
      total_registros:
        type: integer
    type: object
  v1.UpdateBannerInput:
    properties:
      active:
        type: boolean
      end_at:
        type: string
      instagram_url:
        type: string
      position:
        type: integer
      start_at:
        type: string
      title:
        type: string
    type: object
  v1.UpdateFormularioModeloInput:
    properties:
      nome:
        type: string
    type: object
  v1.UpdateStatusPedidoAdocaoInput:
    properties:
      status:
        $ref: '#/definitions/models.PedidoAdocaoStatus'
    type: object
host: localhost:8080
info:
  contact: {}
  description: API para gerenciar ONGs e pets
  title: OngPet API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Faz login via Supabase e retorna tokens (access_token, etc.)
      parameters:
      - description: Credenciais
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/v1.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /api/v1/banners:
    get:
      description: Retorna banners com filtros e paginação
      parameters:
      - description: Filtrar por ativo
        in: query
        name: active
        type: boolean
      - description: Filtrar apenas banners no período vigente (start_at <= now <=
          end_at)
        in: query
        name: vigente
        type: boolean
      - description: 'Página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Itens por página (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.BannerListResponse'
      summary: Lista todos os Banners
      tags:
      - Banner
    post:
      consumes:
      - application/json
      description: Cria um Banner no sistema (sem imagem — use o endpoint de upload)
      parameters:
      - description: Novo Banner
        in: body
        name: banner
        required: true
        schema:
          $ref: '#/definitions/v1.CreateBannerInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Banner'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Cria um novo Banner
      tags:
      - Banner
  /api/v1/banners/{id}:
    delete:
      description: Remove um Banner pelo ID (e sua imagem do storage)
      parameters:
      - description: ID do Banner
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Remove um Banner
      tags:
      - Banner
    get:
      description: Retorna um Banner específico pelo ID
      parameters:
      - description: ID do Banner
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Banner'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca um Banner pelo ID
      tags:
      - Banner
    put:
      consumes:
      - application/json
      description: Atualiza os metadados de um Banner pelo ID (não atualiza imagem)
      parameters:
      - description: ID do Banner
        in: path
        name: id
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: banner
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateBannerInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              banner:
                $ref: '#/definitions/models.Banner'
              message:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Atualiza um Banner existente
      tags:
      - Banner
  /api/v1/banners/{id}/imagem:
    delete:
      description: Remove a imagem do storage e limpa o image_url do Banner
      parameters:
      - description: ID do Banner
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              banner:
                $ref: '#/definitions/models.Banner'
              message:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Remove a imagem de um Banner
      tags:
      - Banner
    post:
      consumes:
      - multipart/form-data
      description: Envia uma imagem para o Banner pelo ID (substitui a anterior)
      parameters:
      - description: ID do Banner
        in: path
        name: id
        required: true
        type: string
      - description: Imagem do Banner
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              banner:
                $ref: '#/definitions/models.Banner'
              message:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Faz upload da imagem de um Banner
      tags:
      - Banner
  /api/v1/formularios:
    get:
      parameters:
      - description: Filtrar por ONG
        in: query
        name: ong_id
        type: string
      - description: 'Página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Itens por página (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.FormularioListResponse'
      security:
      - ApiKeyAuth: []
      summary: Lista todos os Formulários Modelo
      tags:
      - FormularioModelo
    post:
      consumes:
      - application/json
      description: Cria um formulário com campos configuráveis para uso na adoção
        de pets
      parameters:
      - description: Novo Formulário
        in: body
        name: formulario
        required: true
        schema:
          $ref: '#/definitions/v1.CreateFormularioModeloInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.FormularioModelo'
      security:
      - ApiKeyAuth: []
      summary: Cria um novo Formulário Modelo
      tags:
      - FormularioModelo
  /api/v1/formularios/{id}:
    delete:
      description: Remove o formulário e todos os campos em cascata
      parameters:
      - description: ID do Formulário
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Remove um Formulário Modelo
      tags:
      - FormularioModelo
    get:
      parameters:
      - description: ID do Formulário
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.FormularioModelo'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Busca um Formulário Modelo pelo ID
      tags:
      - FormularioModelo
    put:
      consumes:
      - application/json
      parameters:
      - description: ID do Formulário
        in: path
        name: id
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: formulario
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateFormularioModeloInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.FormularioModelo'
      security:
      - ApiKeyAuth: []
      summary: Atualiza o nome de um Formulário Modelo
      tags:
      - FormularioModelo
  /api/v1/formularios/{id}/campos:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID do Formulário
        in: path
        name: id
        required: true
        type: string
      - description: Novo Campo
        in: body
        name: campo
        required: true
        schema:
          $ref: '#/definitions/v1.CreateCampoInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CampoFormulario'
      security:
      - ApiKeyAuth: []
      summary: Adiciona um Campo ao Formulário
      tags:
      - FormularioModelo
  /api/v1/formularios/{id}/campos/{campoId}:
    delete:
      parameters:
      - description: ID do Formulário
        in: path
        name: id
        required: true
        type: string
      - description: ID do Campo
        in: path
        name: campoId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Remove um Campo do Formulário
      tags:
      - FormularioModelo
    put:
      consumes:
      - application/json
      parameters:
      - description: ID do Formulário
        in: path
        name: id
        required: true
        type: string
      - description: ID do Campo
        in: path
        name: campoId
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: campo
        required: true
        schema:
          $ref: '#/definitions/v1.CreateCampoInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CampoFormulario'
      security:
      - ApiKeyAuth: []
      summary: Atualiza um Campo do Formulário
      tags:
      - FormularioModelo
  /api/v1/formularios/{id}/imagem:
    delete:
      parameters:
      - description: ID do Formulário
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              formulario:
                $ref: '#/definitions/models.FormularioModelo'
              message:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Remove a imagem de capa de um Formulário
      tags:
      - FormularioModelo
    post:
      consumes:
      - multipart/form-data
      description: Substitui a imagem existente (se houver) e armazena a nova via
        Supabase
      parameters:
      - description: ID do Formulário
        in: path
        name: id
        required: true
        type: string
      - description: Imagem de capa
        in: formData
        name: imagem
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              formulario:
                $ref: '#/definitions/models.FormularioModelo'
              message:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Faz upload da imagem de capa de um Formulário
      tags:
      - FormularioModelo
  /api/v1/ongs:
    get:
      description: Retorna todas as ONGs cadastradas
      parameters:
      - description: Filtrar por nome
        in: query
        name: nome
        type: string
      - description: Filtrar por e-mail
        in: query
        name: email
        type: string
      - description: 'Página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Itens por página (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
