info:
  contact: {}
paths:
  /api/v1/ongs:
    get:
      description: Retorna todas as ONGs cadastradas
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Ong'
            type: array
      summary: Lista todas as ONGs
      tags:
      - ONG
    post:
      consumes:
      - application/json
      description: Cria uma ONG no sistema
      parameters:
      - description: Nova ONG
        in: body
        name: ong
        required: true
        schema:
          $ref: '#/definitions/models.Ong'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Ong'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria uma nova ONG
      tags:
      - ONG
  /api/v1/pets:
    get:
      description: Retorna todos os pets cadastrados
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Pet'
            type: array
      summary: Lista todos os Pets
      tags:
      - Pet
    post:
      consumes:
      - application/json
      description: Cria um Pet no sistema
      parameters:
      - description: Novo Pet
        in: body
        name: pet
        required: true
        schema:
          $ref: '#/definitions/models.Pet'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Pet'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria um novo Pet
      tags:
      - Pet
swagger: "2.0"
