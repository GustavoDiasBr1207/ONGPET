basePath: /
definitions:
  models.Ong:
    properties:
      created_at:
        type: string
      email:
        type: string
      endereco:
        type: string
      id:
        type: integer
      nome:
        type: string
      nome_responsavel:
        type: string
      pedidosAdocao:
        items:
          $ref: '#/definitions/models.PedidoAdocao'
        type: array
      telefone:
        type: string
      updated_at:
        type: string
    type: object
  models.PedidoAdocao:
    properties:
      created_at:
        type: string
      id:
        type: integer
      ong_id:
        type: integer
      respostas:
        items:
          $ref: '#/definitions/models.RespostaFormulario'
        type: array
      updated_at:
        type: string
    type: object
  models.Pet:
    properties:
      created_at:
        type: string
      especie:
        type: string
      id:
        type: integer
      idade:
        type: integer
      nome:
        type: string
      ong_id:
        type: integer
      raca:
        type: string
      updated_at:
        type: string
    type: object
  models.RespostaFormulario:
    properties:
      campoFormularioId:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      pedidoAdocaoId:
        type: integer
      updated_at:
        type: string
      valor:
        type: string
    type: object
  ongpet_controllers_v0.CreateOngInput:
    properties:
      email:
        example: a@b.com
        type: string
      endereco:
        example: Rua A
        type: string
      nome:
        example: Minha ONG
        type: string
      nome_responsavel:
        example: Fulano
        type: string
      telefone:
        example: "123"
        type: string
    type: object
  ongpet_controllers_v1.CreateOngInput:
    properties:
      email:
        example: a@b.com
        type: string
      endereco:
        example: Rua A
        type: string
      nome:
        example: Minha ONG
        type: string
      nome_responsavel:
        example: Fulano
        type: string
      telefone:
        example: "123"
        type: string
    type: object
  v0.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API para gerenciar ONGs e pets
  title: OngPet API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Faz login via Supabase e retorna tokens (access_token, etc.)
      parameters:
      - description: Credenciais
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/v0.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /api/v1/ongs:
    get:
      description: Retorna todas as ONGs cadastradas
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Ong'
            type: array
      summary: Lista todas as ONGs
      tags:
      - ONG
    post:
      consumes:
      - application/json
      description: Cria uma ONG no sistema
      parameters:
      - description: Nova ONG
        in: body
        name: ong
        required: true
        schema:
          $ref: '#/definitions/ongpet_controllers_v1.CreateOngInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Ong'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Cria uma nova ONG
      tags:
      - ONG
  /api/v1/pets:
    get:
      description: Retorna todos os pets cadastrados
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Pet'
            type: array
      summary: Lista todos os Pets
      tags:
      - Pet
    post:
      consumes:
      - application/json
      description: Cria um Pet no sistema
      parameters:
      - description: Novo Pet
        in: body
        name: pet
        required: true
        schema:
          $ref: '#/definitions/models.Pet'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Pet'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Cria um novo Pet
      tags:
      - Pet
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
