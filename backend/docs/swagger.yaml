basePath: /
definitions:
  models.Ong:
    properties:
      email:
        type: string
      endereco:
        type: string
      nome:
        type: string
      nome_responsavel:
        type: string
      telefone:
        type: string
    type: object
  models.Pet:
    properties:
      especie:
        type: string
      idade:
        type: integer
      nome:
        type: string
      ong_id:
        type: string
      raca:
        type: string
    type: object
  v0.CreateOngInput:
    properties:
      email:
        example: a@b.com
        type: string
      endereco:
        example: Rua A
        type: string
      nome:
        example: Minha ONG
        type: string
      nome_responsavel:
        example: Fulano
        type: string
      telefone:
        example: "123"
        type: string
    type: object
  v0.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  v0.OngListResponse:
    properties:
      dados:
        items:
          $ref: '#/definitions/models.Ong'
        type: array
      proxima_pagina:
        type: boolean
      total_paginas:
        type: integer
      total_registros:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API para gerenciar ONGs e pets
  title: OngPet API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Faz login via Supabase e retorna tokens (access_token, etc.)
      parameters:
      - description: Credenciais
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/v0.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /api/v1/ongs:
    get:
      description: Retorna todas as ONGs cadastradas
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0.OngListResponse'
      summary: Lista todas as ONGs
      tags:
      - ONG
    post:
      consumes:
      - application/json
      description: Cria uma ONG no sistema
      parameters:
      - description: Nova ONG
        in: body
        name: ong
        required: true
        schema:
          $ref: '#/definitions/v0.CreateOngInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Ong'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Cria uma nova ONG
      tags:
      - ONG
  /api/v1/ongs/{id}:
    delete:
      description: Remove uma ONG pelo ID
      parameters:
      - description: ID da ONG
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Remove uma ONG
      tags:
      - ONG
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma ONG pelo ID
      parameters:
      - description: ID da ONG
        in: path
        name: id
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: ong
        required: true
        schema:
          $ref: '#/definitions/v0.CreateOngInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
              ong:
                $ref: '#/definitions/models.Ong'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Atualiza uma ONG existente
      tags:
      - ONG
  /api/v1/pets:
    get:
      description: Retorna todos os pets cadastrados
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Pet'
            type: array
      summary: Lista todos os Pets
      tags:
      - Pet
    post:
      consumes:
      - application/json
      description: Cria um Pet no sistema
      parameters:
      - description: Novo Pet
        in: body
        name: pet
        required: true
        schema:
          $ref: '#/definitions/models.Pet'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Pet'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Cria um novo Pet
      tags:
      - Pet
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
