root = "."
tmp_dir = "tmp"

[build]
cmd = "swag init -g main.go && go build -o ./tmp/main ."
bin = "tmp/main"
full_bin = "tmp/main"

include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "docs"]
exclude_file = ["*_test.go"]
delay = 1000

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"
